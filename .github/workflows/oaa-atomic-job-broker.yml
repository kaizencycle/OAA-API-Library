name: OAA Atomic Job Broker Tests

on:
  pull_request:
    paths:
      - "app/jobs/**"
      - "app/sentinel/auth.py"
      - "tests/test_jobs_broker.py"
      - "tests/test_jobs_broker_postgres_integration.py"
      - "tests/postgres_broker_helpers.py"
      - "tests/test_sentinel_auth.py"
      - ".github/workflows/oaa-atomic-job-broker.yml"
      - "requirements.txt"
  push:
    branches:
      - codex/c410-phase2-atomic-job-broker
      - cursor/c411-oaa-broker-ci-verification-0e02

permissions:
  contents: read

jobs:
  broker-tests:
    name: OAA Atomic Job Broker Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oaa_test
          POSTGRES_PASSWORD: oaa_test_password
          POSTGRES_DB: oaa_job_broker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oaa_test -d oaa_job_broker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://oaa_test:oaa_test_password@localhost:5432/oaa_job_broker_test
      MOBIUS_CODEX_HMAC_KEY: test-fixture-codex-hmac-key
      MOBIUS_ATLAS_HMAC_KEY: test-fixture-atlas-hmac-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile broker modules
        run: python -m compileall -q app/jobs app/main.py

      - name: Unit broker and sentinel auth tests
        run: pytest -q tests/test_jobs_broker.py tests/test_sentinel_auth.py

      - name: PostgreSQL witness
        run: python -c "import os, psycopg2; conn = psycopg2.connect(os.environ['DATABASE_URL']); cur = conn.cursor(); cur.execute('SELECT version()'); print(cur.fetchone()[0])"

      - name: PostgreSQL integration tests
        run: pytest -q tests/test_jobs_broker_postgres_integration.py

      - name: Diff whitespace check
        run: git diff --check
